<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ee">
  <title>筆記區｜UCL Urban Spatial Science MSc</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #102a43;
      --muted: #5f7184;
      --paper: #f7f4ee;
      --line: #dbe2e8;
      --navy: #082b49;
      --blue: #1e6f8f;
      --coral: #e9755b;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: radial-gradient(circle at 10% 0%, rgba(232,178,76,.16), transparent 28rem), linear-gradient(180deg, #fbfaf7 0%, var(--paper) 100%);
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      line-height: 1.65;
    }
    a { color: var(--blue); }
    a:focus-visible { outline: 3px solid var(--coral); outline-offset: 4px; }
    .wrap { width: min(1000px, calc(100% - 36px)); margin: 0 auto; }
    .topbar { position: sticky; top: 0; z-index: 2; padding: 16px 0; border-bottom: 1px solid rgba(16,42,67,.10); background: rgba(255,253,249,.9); backdrop-filter: blur(12px); }
    .topbar-inner { display: flex; justify-content: space-between; align-items: center; gap: 20px; min-width: 0; }
    .brand { color: var(--navy); font-size: 1.05rem; font-weight: 850; text-decoration: none; }
    nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px 16px; min-width: 0; }
    nav a { display: inline-flex; align-items: center; min-height: 40px; color: var(--ink); font-size: .9rem; font-weight: 750; text-decoration: none; }
    nav a[aria-current="page"] { color: var(--coral); }
    main { padding: 54px 0 72px; }
    h1 { margin: 10px 0 0; color: var(--navy); font-size: clamp(2.5rem, 7vw, 5rem); letter-spacing: -.06em; line-height: .98; }
    .topics { display: grid; gap: 16px; margin-top: 32px; }
    .topic { padding: 24px; border: 1px solid var(--line); background: rgba(255,253,249,.82); }
    .topic h2 { margin: 0; color: var(--navy); font-size: clamp(1.35rem, 3vw, 1.8rem); }
    .subtopics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
    .subtopic { padding: 16px; border-left: 3px solid var(--blue); background: #f3f6f6; color: var(--ink); font-weight: 750; }
    @media (max-width: 820px) {
      .topbar { padding: 10px 0; }
      .topbar-inner { align-items: flex-start; flex-direction: column; gap: 8px; }
      .topbar-inner > * { width: 100%; }
      .brand { display: inline-block; max-width: 100%; overflow-wrap: anywhere; }
      nav { justify-content: flex-start; gap: 6px; }
      nav a { padding: 6px 10px; border: 1px solid var(--line); background: rgba(255,253,249,.78); }
      nav a[aria-current="page"] { border-color: var(--navy); background: var(--navy); color: #fffaf1; }
      main { padding-top: 40px; }
    }
    @media (max-width: 600px) { .subtopics { grid-template-columns: 1fr; } }
    @media (max-width: 480px) {
      .wrap { width: min(100% - 24px, 1000px); }
      .topbar nav { display: flex; flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; }
      .topbar nav a { flex: 0 0 auto; justify-content: flex-start; min-height: 44px; white-space: nowrap; }
      main { padding-top: 32px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html">Urban Spatial Science MSc</a>
      <nav aria-label="頁面導覽">
        <a href="index.html">總覽</a>
        <a href="term1.html">Term 1</a>
        <a href="term2.html">Term 2</a>
        <a href="notes.html" aria-current="page">筆記區</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <h1>筆記區</h1>
    <div class="topics">
      <section class="topic" aria-labelledby="programming-basics">
        <h2 id="programming-basics">程式基礎</h2>
      </section>
      <section class="topic" aria-labelledby="ai-usage">
        <h2 id="ai-usage">AI 的使用方式</h2>
        <div class="subtopics">
          <div class="subtopic">如何下 Prompt</div>
          <div class="subtopic">模型的 Effort</div>
        </div>
      </section>
    </div>
  </main>

<script id="language-switcher">
(() => {
  const translations = {"筆記區":"Note area","模型的 Effort":"Model Effort","筆記區｜UCL Urban Spatial Science MSc":"Notes Area｜UCL Urban Spatial Science MSc","頁面導覽":"Page navigation","AI 的使用方式":"How AI is used","如何下 Prompt":"How to download Prompt","程式基礎":"Programming basics","總覽":"Overview"};
  const storageKey = 'ucl-urban-spatial-science-language';
  const nav = document.querySelector('.topbar nav');
  if (!nav) return;
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'language-toggle';
  button.setAttribute('aria-label', 'Switch page language');
  button.style.cssText = 'appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.84rem;font-weight:800;padding:7px 11px;min-height:40px;cursor:pointer;';
  nav.append(button);
  const lang = localStorage.getItem(storageKey) === 'en' ? 'en' : 'zh';
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode(node) { return node.parentElement && !node.parentElement.closest('script,style') && translations[node.nodeValue] !== undefined ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; } });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  const attrs = [];
  document.querySelectorAll('[aria-label], [placeholder], [title]').forEach(el => {
    for (const name of ['aria-label','placeholder','title']) if (el.hasAttribute(name) && translations[el.getAttribute(name)] !== undefined) attrs.push([el,name,el.getAttribute(name)]);
  });
  const originalTitle = document.title;
  function apply(language) {
    const english = language === 'en';
    nodes.forEach(node => { const original = node.__zh ?? node.nodeValue; node.__zh = original; node.nodeValue = english ? translations[original] : original; });
    attrs.forEach(([el,name,original]) => el.setAttribute(name, english ? translations[original] : original));
    document.title = english ? (translations[originalTitle] || originalTitle) : originalTitle;
    document.documentElement.lang = english ? 'en' : 'zh-Hant';
    button.textContent = english ? '中文' : 'English';
    button.setAttribute('aria-pressed', String(english));
    localStorage.setItem(storageKey, language);
  }
  button.addEventListener('click', () => apply(document.documentElement.lang === 'en' ? 'zh' : 'en'));
  apply(lang);
})();
</script>
</body>
</html>
